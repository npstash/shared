[mypy]
# Rule typed-code: strict mode, no explicit Any. The cache stays in .local_assets/ (rule tests-and-ci).
strict = True
disallow_any_explicit = True
cache_dir = .local_assets/mypy-cache
mypy_path = src:../auth/src
files = src, tests, conftest.py


[mypy-win32cred.*]
ignore_missing_imports = True

[mypy-win32ctypes.*]
ignore_missing_imports = True
