[pytest]
# The cache of pytest stays in .local_assets/ (rule tests-and-ci).
cache_dir = .local_assets/pytest-cache
testpaths = tests
pythonpath = src
# Do NOT add `addopts = --basetemp=...` here: conftest.py sets basetemp, and an
# ini-supplied value reaches pytest_configure as if typed on the command line, so
# the hook would skip creating the (gitignored, hence absent in CI) parent folder.
