# Config of browser-automation-x-mcp. See README.md, section "Config".

[fill]
; Fill providers (folders in providers-form-fill/), in the order that the server asks them.
providers = vault, ini, ask

[mask]
; <provider> = true: results and output files show *** in place of the values of the provider.
; A provider without a line is masked.
vault = true
ini = false
ask = true

[hosts]
; true: add the host of each opened page to [allow] in host-policy.ini. false: do not change host-policy.ini.
record = true

[storage]
; Hosts that keep their IndexedDB in the storage state of the lanes, e.g. web.whatsapp.com.
; Cookies and localStorage are always kept.
indexeddb =
