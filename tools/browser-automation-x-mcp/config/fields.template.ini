# Form fields that the facade fills. See README.md, section "Form fill".
# One section for each URL pattern: "host/path". "*" in the path is each sequence of characters.
# A pattern without a path matches each path. Scheme, port, query and fragment have no effect.
#   <value name> = <CSS selector>      the providers give the value for the name
#   submit = <CSS selector>            optional: the element to click to submit
# After the fill, the facade submits the form.

; [login.example.com/u/*/login]
; username = input[name="username"]
; password = input[type="password"]
