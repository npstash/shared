# Form fields that the server fills. See README.md, section "Form fill".
# One section for each URL pattern: "host/path". "*" in the path is each sequence of characters.
# A pattern without a path matches each path. Scheme, port, query and fragment have no effect.
#   <value name> = <selector>          the providers give the value for the name
#   submit = <selector>                optional, also more lines: the server clicks the first visible one
# A selector is CSS, or a label or role locator of Playwright, e.g. internal:label="Password"s.
# After the fill, the server submits the form.

; [login.example.com/u/*/login]
; username = input[name="username"]
; password = input[type="password"]
