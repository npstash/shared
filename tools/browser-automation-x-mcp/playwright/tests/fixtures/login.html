<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Login</title></head>
<body>
  <h1>Login</h1>
  <form method="post" action="/login-again">
    <p><label for="user">User</label> <input id="user" name="user" autocomplete="username"></p>
    <p><label for="pass">Password</label> <input id="pass" name="pass" type="password"></p>
    <p><button type="submit">Sign in</button></p>
  </form>
</body>
</html>
