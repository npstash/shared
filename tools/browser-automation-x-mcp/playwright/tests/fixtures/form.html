<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Registration form</title></head>
<body>
  <h1>Registration</h1>
  <form method="post" action="/submit">
    <p><label for="full-name">Full name</label> <input id="full-name" name="fullName" type="text" required></p>
    <p><label for="email">Email</label> <input id="email" name="email" type="email" required></p>
    <p><label for="password">Password</label> <input id="password" name="password" type="password"></p>
    <p><label for="age">Age</label> <input id="age" name="age" type="number" min="0" max="150"></p>
    <p><label for="birthday">Birthday</label> <input id="birthday" name="birthday" type="date"></p>
    <p><label for="bio">Bio</label> <textarea id="bio" name="bio"></textarea></p>
    <p>
      <label for="country">Country</label>
      <select id="country" name="country">
        <option value="">Select a country</option>
        <option value="pl">Poland</option>
        <option value="de">Germany</option>
        <option value="fr">France</option>
      </select>
    </p>
    <p>
      <label for="languages">Languages</label>
      <select id="languages" name="languages" multiple>
        <option value="en">English</option>
        <option value="pl">Polish</option>
        <option value="de">German</option>
      </select>
    </p>
    <fieldset>
      <legend>Plan</legend>
      <label><input type="radio" name="plan" value="basic" checked> Basic</label>
      <label><input type="radio" name="plan" value="pro"> Pro</label>
    </fieldset>
    <p><label><input id="newsletter" type="checkbox" name="newsletter" value="yes"> Subscribe to the newsletter</label></p>
    <p><label for="volume">Volume</label> <input id="volume" name="volume" type="range" min="0" max="10" value="5"></p>
    <p><button type="submit">Register</button></p>
  </form>
</body>
</html>
