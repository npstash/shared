# Vault provider of browser-automation-x-mcp: secrets from the vault (shared/tools/auth).
# The provider uses only the vault systems in [systems]. It does not search the vault.
# The value name of fields.ini is the secret name of the system, e.g. username, password.

[vault]
; The folder name of the vault, e.g. vault-main. It has no default.
vault =

[systems]
; <host or URL prefix> = <exact name of the vault system>
; A host also matches its subdomains. If more lines match a page, the longest URL prefix wins.
; example.com = Example - Jan
; https://example.com/shop = Example shop - Jan
