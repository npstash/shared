<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Account form</title></head>
<body>
  <h1>Account</h1>
  <form method="post" action="/submit">
    <p><label for="name">Name</label> <input id="name" name="name" type="text"></p>
    <p><label for="email">Email</label> <input id="email" name="email" type="email"></p>
    <p><label for="phone">Phone</label> <input id="phone" name="phone" type="tel"></p>
    <p><label for="username">Username</label> <input id="username" name="username" type="text"></p>
    <p><label for="password">Password</label> <input id="password" name="password" type="password"></p>
    <p><label for="note">Note</label> <input id="note" name="note" type="text"></p>
    <p><button type="submit">Save</button></p>
  </form>
</body>
</html>
