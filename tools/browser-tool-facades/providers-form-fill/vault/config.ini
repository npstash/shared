# Vault provider of the browser tool facades (shared by all facades): secrets from the vault (shared/tools/auth).
# The page host selects the vault system by the "url" of the system. See index.js.
# Paths are relative to this folder.

[vault]
; The vault home. Empty: the vault tool finds it (./vaults/vault-main in the working folder).
vault_home = ../../../../../vaults/vault-main
; A sub-vault of the vault home (subvaults/<name>). Empty: the main vault.
subvault =
; The launcher of the vault tool. On Windows, the facade uses run.bat beside it.
tool = ../../../auth/run.sh
