# INI provider of the browser tool facades (shared by all facades): values that are not secret.
# The agent writes a placeholder, e.g. {{email}}. The facade puts in the value of "email".
# Put secrets into the vault (vault provider), not into this committed file.
#
# [all] has values for each host. A section with a host pattern has values for matching hosts.
# Patterns: example.com (exact), *.example.com (subdomains), 192.168.1.* (IPv4).
# The most specific section wins: an exact host, then a longer pattern, then [all].

[all]
; name = Jan Kowalski
; email = jan.kowalski@example.com
; address = ul. Przykladowa 1, 00-001 Warszawa

; Example: on the subdomains of example.com, give an other email.
[*.example.com]
; email = jan@work.example.com
