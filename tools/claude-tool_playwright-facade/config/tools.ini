# Tool switches of the Playwright facade: "<tool> = enabled" or "<tool> = disabled".
# The facade adds a line with the default value for each new tool when it starts.
# A disabled tool stays in the tool list. A call to it fails with the reason.

[tools]
browser_click = enabled
browser_close = enabled
browser_console_messages = enabled
browser_drag = enabled
browser_drop = disabled
browser_emulate_media = enabled
browser_evaluate = disabled
browser_file_upload = disabled
browser_fill_form = enabled
browser_find = enabled
browser_handle_dialog = enabled
browser_hover = enabled
browser_navigate = enabled
browser_navigate_back = enabled
browser_network_request = enabled
browser_network_requests = enabled
browser_press_key = enabled
browser_resize = enabled
browser_run_code_unsafe = disabled
browser_select_option = enabled
browser_snapshot = enabled
browser_tabs = enabled
browser_take_screenshot = enabled
browser_type = enabled
browser_wait_for = enabled
fill_values_list = enabled
