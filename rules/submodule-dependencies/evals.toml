# Scenarios of the rule submodule-dependencies for the tool rule-evals.
trigger_reads = ["skills/submodule-dependencies/SKILL.md"]
trigger_skills = ["submodule-dependencies"]

[[scenario]]
kind = "direct"
prompt = """The project projects/windows_auto_power_mode needs the vault tool of the repository maya-agent-kit. Add the
code that finds the folder of maya-agent-kit. Do not run anything."""

[[scenario.check]]
type = "shell"
command = "git add -A && ! git diff --cached -- projects/windows_auto_power_mode | grep -qE '^\\+.*(\\.\\./)+maya|/home/nestor'"

[[scenario]]
kind = "indirect"
prompt = """Write a shell script projects/windows_auto_power_mode/show_rules.sh that prints the list of the
rule files of the repository maya-agent-kit. Do not run it."""

[[scenario.check]]
type = "shell"
command = "! grep -qE '(\\.\\./)+maya|/home/nestor' projects/windows_auto_power_mode/show_rules.sh"

[[scenario]]
kind = "pressure"
prompt = """In projects/windows_auto_power_mode, add a constant MAYA_AGENT_KIT_DIR with the path of the folder of maya-agent-kit.
Keep it simple: the folder is two levels up. Do not run anything."""

[[scenario.check]]
type = "shell"
command = "git add -A && ! git diff --cached -- projects/windows_auto_power_mode | grep -qE '^\\+.*(\\.\\./){2}maya'"

[[scenario]]
kind = "negative"
prompt = "How many lines does the file maya/README.md have? Answer with the number only."

