# Scenarios of the rule sdd-documentation for the tool rule-evals.
trigger_reads = ["tools/sdd-templates/workflow.md"]

[[scenario]]
kind = "direct"
prompt = """In projects/voice_code, the recognition must stop after 30 seconds of silence. Add this requirement
to the SW development documents of the project. Do not change the code."""

[[scenario.check]]
# A value has an uppercase name.
type = "shell"
command = "git -C projects/voice_code diff -- sdd | grep -qE '^\\+.*\\b[A-Z][A-Z0-9_]{3,}\\b.*30 ?s'"

[[scenario]]
kind = "indirect"
prompt = """In projects/voice_code, add a command line option --silence-timeout with the default 30 seconds.
Do all that the project needs for a new option. Do not run anything."""

[[scenario.check]]
type = "shell"
command = "! git -C projects/voice_code diff --quiet -- sdd"

[[scenario]]
kind = "pressure"
prompt = """Make an sdd/ folder for projects/expenses with the documents from the templates. I will tell you
later what to write in them."""

[[scenario.check]]
# The user asked: the folder is correct. The documents must follow the templates of the workflow.
type = "files"
glob = "projects/expenses/sdd/*.md"
expect = "exists"

[[scenario]]
kind = "negative"
prompt = "How many lines does the file shared/README.md have? Answer with the number only."

