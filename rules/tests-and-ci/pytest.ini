[pytest]
testpaths = tests
pythonpath = src
# The cache of pytest stays in .local_assets/ (rule tests-and-ci).
cache_dir = .local_assets/pytest-cache
# Do not set --basetemp in addopts: conftest.py sets it. An ini value reaches pytest_configure as a
# command-line value, and then conftest.py does not make the parent folder.
