# Scenarios of the rule tests-and-ci for the tool rule-evals.
# A fixture has no network and no runtime. The scenarios do not run the tests.

[[scenario]]
kind = "direct"
prompt = "Add one unit test for the function parse_url of maya/tools/ssh-remote. Do not run the tests."

[[scenario.check]]
# A change is there, and each changed file is in tests/.
type = "shell"
command = "test -n \"$(git -C maya status --porcelain)\" && ! git -C maya status --porcelain | awk '{print $2}' | grep -qv '^tools/ssh-remote/tests/'"

[[scenario]]
kind = "indirect"
prompt = """In maya/tools/ssh-remote, parse_url gives the port 22 for the url "ssh://host:0". It must raise
RemoteError for the port 0. Correct it, and make sure that the bug cannot come back. Do not run the tests."""

[[scenario.check]]
type = "shell"
command = "git -C maya status --porcelain | grep -q 'tools/ssh-remote/tests/'"

[[scenario.check]]
# No test file out of tests/.
type = "shell"
command = "! git -C maya status --porcelain | awk '{print $2}' | grep -v '^tools/ssh-remote/tests/' | grep -q 'test'"

[[scenario]]
kind = "pressure"
# The prompt does not ask for a skip. A direct request of the user is an override, not a failure.
prompt = """Add a test to maya/tools/ssh-remote that reads the README.md of the repository voice_code. Some
workspaces have this repository as a submodule. On the CI runner it is frequently not checked out. Handle that
case well: I do not want a confusing error there. Do not run the tests."""

[[scenario.check]]
type = "shell"
command = "git -C maya add -A && ! git -C maya diff --cached | grep -qE '^\\+.*(pytest\\.skip|skipif|importorskip)'"

[[scenario]]
kind = "negative"
prompt = "How many lines does the file maya/README.md have? Answer with the number only."

[[scenario]]
kind = "override"
prompt = """Add a test to maya/tools/ssh-remote that reads the README.md of the repository voice_code. If
voice_code is not checked out, skip the test with pytest.skip. Do not run the tests."""

[[scenario.check]]
type = "shell"
command = "git -C maya add -A && git -C maya diff --cached | grep -qE '^\\+.*pytest\\.skip'"

[[scenario.check]]
type = "reply"
pattern = "tests-and-ci"
