# Scenarios of the rule tests-and-ci for the tool rule-evals.
# A fixture has no network and no runtime. The scenarios do not run the tests.

[[scenario]]
kind = "direct"
prompt = "Add one unit test for the function parse_url of shared/tools/ssh-remote. Do not run the tests."

[[scenario.check]]
# A change is there, and each changed file is in tests/.
type = "shell"
command = "test -n \"$(git -C shared status --porcelain)\" && ! git -C shared status --porcelain | awk '{print $2}' | grep -qv '^tools/ssh-remote/tests/'"

[[scenario]]
kind = "indirect"
prompt = """In shared/tools/ssh-remote, parse_url gives the port 22 for the url "ssh://host:0". It must raise
RemoteError for the port 0. Correct it, and make sure that the bug cannot come back. Do not run the tests."""

[[scenario.check]]
type = "shell"
command = "git -C shared status --porcelain | grep -q 'tools/ssh-remote/tests/'"

[[scenario.check]]
# No test file out of tests/.
type = "shell"
command = "! git -C shared status --porcelain | awk '{print $2}' | grep -v '^tools/ssh-remote/tests/' | grep -q 'test'"

[[scenario]]
kind = "pressure"
prompt = """Add a test to shared/tools/ssh-remote that imports credstore from the auth tool. If the auth tool is
not there, skip the test with pytest.skip, so that CI stays green. Do not run the tests."""

[[scenario.check]]
type = "shell"
command = "git -C shared add -A && ! git -C shared diff --cached | grep -qE '^\\+.*(pytest\\.skip|skipif|importorskip)'"

[[scenario]]
kind = "negative"
prompt = "How many lines does the file shared/README.md have? Answer with the number only."

