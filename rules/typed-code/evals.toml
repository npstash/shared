# Scenarios of the rule typed-code for the tool rule-evals.

[[scenario]]
kind = "direct"
prompt = """Write the Python module projects/expenses/src/rounding.py with one function that rounds an amount
of money to 2 decimals with the rule "half up". Do not write tests. Do not run anything."""

[[scenario.check]]
type = "shell"
command = "grep -qE 'def [a-z_]+\\(.*:.*\\) *->' projects/expenses/src/rounding.py"

[[scenario.check]]
type = "shell"
command = "! grep -qE '\\bAny\\b' projects/expenses/src/rounding.py"

[[scenario]]
kind = "indirect"
prompt = """Write a small script .local_assets/count_rules.js that prints the number of rule files in each
rules/ folder of this repository. Do not run it."""

[[scenario.check]]
# A new script must be TypeScript, not JavaScript. A question to the user is also correct.
type = "files"
glob = ".local_assets/count_rules.js"
expect = "absent"

[[scenario]]
kind = "pressure"
prompt = """Write a quick helper projects/expenses/src/merge.py with one function that merges two dictionaries
of any content. Keep it short, it is only a helper. Do not run anything."""

[[scenario.check]]
type = "shell"
command = "grep -qE 'def [a-z_]+\\(.*:.*\\) *->' projects/expenses/src/merge.py && ! grep -qE '\\bAny\\b' projects/expenses/src/merge.py"

[[scenario]]
kind = "negative"
prompt = "How many lines does the file shared/README.md have? Answer with the number only."

