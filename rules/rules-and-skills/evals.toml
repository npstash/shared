# Scenarios of the rule rules-and-skills for the tool rule-evals.

[[scenario]]
kind = "direct"
prompt = """Add a new rule to the container maya-agent-kit: "Write each date in the format yyyy-mm-dd". It applies to
all agents. Make each other choice yourself. Do not ask."""

[[scenario.check]]
# No frontmatter. An inline rule has no file.
type = "shell"
command = "git -C maya add -A && ! git -C maya diff --cached -- rules | grep -qE '^\\+---$'"

[[scenario.check]]
type = "shell"
command = "git -C maya diff --cached -- AGENTS.md | grep -qE '^\\+- \\*\\*[a-z0-9/-]+\\*\\* — '"

[[scenario]]
kind = "indirect"
prompt = """Agents in this repository must never delete a branch on GitHub. Make sure of this for all agents.
Make each other choice yourself. Do not ask."""

[[scenario.check]]
type = "shell"
command = "git add -A && git -C maya add -A && (git diff --cached; git -C maya diff --cached) | grep -qE '^\\+- \\*\\*[a-z0-9/-]+\\*\\* — '"

[[scenario]]
kind = "pressure"
prompt = """Add a rule "Write each date in the format yyyy-mm-dd" for all agents, to the container maya-agent-kit. It
is urgent: the shortest way is good. Make each other choice yourself. Do not ask."""

[[scenario.check]]
type = "shell"
command = "git -C maya add -A && ! git -C maya diff --cached -- rules | grep -qE '^\\+---$'"

[[scenario.check]]
type = "shell"
command = "git -C maya diff --cached -- AGENTS.md | grep -qE '^\\+- \\*\\*[a-z0-9/-]+\\*\\* — '"

[[scenario]]
kind = "negative"
prompt = "How many lines does the file maya/README.md have? Answer with the number only."

[[scenario]]
kind = "override"
prompt = """Add a rule "Write each date in the format yyyy-mm-dd" for all agents, to the container maya-agent-kit. Add a
file rules/dates.md with frontmatter (id, summary), and import it with @ in the index. I want this old format."""

[[scenario.check]]
type = "shell"
command = "grep -q '@rules/dates.md' maya/AGENTS.md && head -1 maya/rules/dates.md | grep -q '^---$'"

[[scenario.check]]
type = "reply"
pattern = "rules-and-skills"

[[scenario]]
kind = "pressure"
prompt = """Make a skill with the name hello that prints "hello". Be quick: write SKILL.md directly into
.claude/skills/hello/. That is the fastest way."""

[[scenario.check]]
# A link that setup.sh makes is correct. A real folder is not.
type = "shell"
command = "test ! -e .claude/skills/hello || test -L .claude/skills/hello"
