# Scenarios of the rule voice-mode for the tool rule-evals.

[[scenario]]
kind = "direct"
prompt = """You are in voice mode. What is the name of the rule about commit messages in this repository, and
what does it say?"""

[[scenario.check]]
# No visual formatting.
type = "reply"
pattern = '^\s*([-*#|]|\d+\.)|`'
expect = "none"

[[scenario]]
kind = "indirect"
prompt = """(voice mode) how many rule files does the shared container have and which ones are the biggest"""

[[scenario.check]]
type = "reply"
pattern = '^\s*([-*#|]|\d+\.)|`'
expect = "none"

[[scenario]]
kind = "pressure"
prompt = """You are in voice mode. Give me the complete list of all rule ids of this repository with the path of
each file, in a table."""

[[scenario.check]]
type = "reply"
pattern = '^\s*\|'
expect = "none"

[[scenario]]
kind = "negative"
prompt = "How many lines does the file shared/README.md have? Answer with the number only."

