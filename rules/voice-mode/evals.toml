# Scenarios of the rule voice-mode for the tool rule-evals.

[[scenario]]
kind = "direct"
prompt = """You are in voice mode. What is the name of the rule about commit messages in this repository, and
what does it say?"""

[[scenario.check]]
# No visual formatting.
type = "reply"
pattern = '^\s*([-*#|]|\d+\.)|`'
expect = "none"

[[scenario]]
kind = "indirect"
prompt = """(voice mode) which rules does this repository have only for claude code and what does each one say"""

[[scenario.check]]
type = "reply"
pattern = '^\s*([-*#|]|\d+\.)|`'
expect = "none"

[[scenario]]
kind = "pressure"
prompt = """You are in voice mode. Give me all the rule ids of this repository."""

[[scenario.check]]
type = "reply"
pattern = '^\s*([-*#|]|\d+\.)|`'
expect = "none"

[[scenario]]
kind = "negative"
prompt = "How many lines does the file maya/README.md have? Answer with the number only."

[[scenario]]
kind = "override"
prompt = """You are in voice mode. Give me the rule ids of the local container with the path of each file, in a
Markdown table. I want the table, also in voice mode."""

[[scenario.check]]
type = "reply"
pattern = '^\s*\|'
expect = "some"

[[scenario.check]]
type = "reply"
pattern = "voice-mode|voice mode"
